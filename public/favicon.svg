<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Left stem gradient: violet to indigo -->
    <linearGradient id="left-stem-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" /> <!-- purple/violet -->
      <stop offset="100%" stop-color="#6366f1" /> <!-- indigo -->
    </linearGradient>
    
    <!-- Right stem gradient: blue to cyan -->
    <linearGradient id="right-stem-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- blue -->
      <stop offset="100%" stop-color="#22d3ee" /> <!-- cyan -->
    </linearGradient>
    
    <!-- Diagonal gradient: violet to cyan transition -->
    <linearGradient id="diag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Spark gradient: hot pink to bright purple -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" /> <!-- pink-400 -->
      <stop offset="50%" stop-color="#ec4899" /> <!-- pink-500 -->
      <stop offset="100%" stop-color="#d946ef" /> <!-- fuchsia-500 -->
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow-effect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glow for the small spark -->
    <filter id="small-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Glow to make it stand out on dark browser tabs -->
  <circle cx="64" cy="64" r="50" fill="#a855f7" opacity="0.15" filter="url(#glow-effect)" />

  <!-- Diagonal of the 'N' -->
  <path d="M 44 32 L 84 88 L 84 98 L 44 42 Z" fill="url(#diag-grad)" opacity="0.9" />

  <!-- Left Stem of the 'N' -->
  <rect x="28" y="24" width="16" height="80" rx="8" fill="url(#left-stem-grad)" />

  <!-- Right Stem of the 'N' (incorporating the message bubble shape) -->
  <rect x="84" y="24" width="16" height="80" rx="8" fill="url(#right-stem-grad)" />
  <!-- Message bubble tail -->
  <path d="M 84 82 L 68 94 L 84 94 Z" fill="url(#right-stem-grad)" />

  <!-- Main AI Spark (glowing cross) at the center of the 'N' -->
  <path d="M 64 36 Q 64 64 44 64 Q 64 64 64 92 Q 64 64 84 64 Q 64 64 64 36 Z" fill="url(#spark-grad)" filter="url(#glow-effect)" />
  <!-- Core of the main spark (bright white for 3D hot center) -->
  <path d="M 64 48 Q 64 64 52 64 Q 64 64 64 80 Q 64 64 76 64 Q 64 64 64 48 Z" fill="#ffffff" />

  <!-- Accent Spark (smaller AI sparkle) at top-right -->
  <path d="M 96 18 Q 96 28 86 28 Q 96 28 96 38 Q 96 28 106 28 Q 96 28 96 18 Z" fill="#22d3ee" filter="url(#small-glow)" />
  <path d="M 96 23 Q 96 28 91 28 Q 96 28 96 33 Q 96 28 101 28 Q 96 28 96 23 Z" fill="#ffffff" />
</svg>